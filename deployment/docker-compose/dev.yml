# ============================================================
# Industrial IoT Platform - Development Environment
# ============================================================
version: "3.9"

services:
  # ---------- Infrastructure ----------

  # MQTT Broker - IoT device connectivity
  emqx:
    image: emqx/emqx:5.7.0
    container_name: iiot-emqx
    ports:
      - "1883:1883"   # MQTT
      - "8084:8083"   # MQTT over WebSocket
      - "8883:8883"   # MQTT over TLS
      - "18083:18083" # Dashboard
    environment:
      EMQX_NAME: emqx
      EMQX_HOST: 127.0.0.1
      EMQX_DASHBOARD__DEFAULT_PASSWORD: admin123
    volumes:
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    networks:
      - iiot-net
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      retries: 5

  # Message Queue - Event streaming
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: iiot-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - iiot-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: iiot-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - iiot-net
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      retries: 5

  # Time-Series Database
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: iiot-timescaledb
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: iiot
      POSTGRES_PASSWORD: iiot_dev_2024
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    networks:
      - iiot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iiot -d telemetry"]
      interval: 10s
      retries: 5

  # Main Database
  postgres:
    image: postgres:16-alpine
    container_name: iiot-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: industrial_iot
      POSTGRES_USER: iiot
      POSTGRES_PASSWORD: iiot_dev_2024
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iiot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iiot -d industrial_iot"]
      interval: 10s
      retries: 5

  # Cache
  redis:
    image: redis:7-alpine
    container_name: iiot-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass iiot_dev_2024
    volumes:
      - redis-data:/data
    networks:
      - iiot-net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      retries: 5

  # Identity Provider
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: iiot-keycloak
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/industrial_iot
      KC_DB_USERNAME: iiot
      KC_DB_PASSWORD: iiot_dev_2024
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iiot-net

  # ---------- Observability ----------

  prometheus:
    image: prom/prometheus:latest
    container_name: iiot-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../kubernetes/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - iiot-net

  grafana:
    image: grafana/grafana:latest
    container_name: iiot-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - iiot-net

  loki:
    image: grafana/loki:latest
    container_name: iiot-loki
    ports:
      - "3100:3100"
    networks:
      - iiot-net

  # ---------- Application Services ----------

  # Gateway Service (MQTT → Kafka bridge)
  gateway-service:
    build:
      context: ../../gateway-service
      dockerfile: Dockerfile
    container_name: iiot-gateway
    depends_on:
      emqx:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      MQTT_BROKER: emqx
      MQTT_PORT: "1883"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      KAFKA_BROKER: kafka:9092
    networks:
      - iiot-net
    restart: unless-stopped

  # Telemetry Service (Kafka → TimescaleDB + API)
  telemetry-service:
    build:
      context: ../../telemetry-service
      dockerfile: Dockerfile
    container_name: iiot-telemetry
    ports:
      - "8082:8082"
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      TSDB_HOST: timescaledb
      TSDB_PORT: "5432"
      TSDB_DATABASE: telemetry
      TSDB_USER: iiot
      TSDB_PASSWORD: iiot_dev_2024
      KAFKA_BROKER: kafka:9092
    networks:
      - iiot-net
    restart: unless-stopped

  # ---------- Object Storage ----------

  # MinIO - Firmware binary storage
  minio:
    image: minio/minio:latest
    container_name: iiot-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - iiot-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  # Device Service (Device Registry + Shadow + Firmware OTA)
  device-service:
    build:
      context: ../../device-service
      dockerfile: Dockerfile
    container_name: iiot-device
    ports:
      - "8085:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: industrial_iot
      POSTGRES_USER: iiot
      POSTGRES_PASSWORD: iiot_dev_2024
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: iiot_dev_2024
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: firmwares
      MINIO_USE_SSL: "false"
      API_PORT: "8083"
    networks:
      - iiot-net
    restart: unless-stopped

volumes:
  emqx-data:
  emqx-log:
  timescaledb-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  minio-data:

networks:
  iiot-net:
    driver: bridge
